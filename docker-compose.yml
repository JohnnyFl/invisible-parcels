services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: novapost
      POSTGRES_PASSWORD: novapost
      POSTGRES_DB: novapost
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novapost"]
      interval: 2s
      retries: 20

volumes:
  pgdata:
