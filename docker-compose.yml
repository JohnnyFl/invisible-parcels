# Full run: `make up`, then https://localhost. For development only postgres is needed (`make db`).
x-secrets: &secrets
  INGEST_SECRET: ${INGEST_SECRET:-dev-ingest-secret}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: novapost
      POSTGRES_PASSWORD: novapost
      POSTGRES_DB: novapost
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novapost"]
      interval: 2s
      retries: 20

  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      <<: *secrets
      DATABASE_URL: postgres://novapost:novapost@postgres:5432/novapost?sslmode=disable
      EMULATOR_URL: http://emulator:8090
      APP_SECRET: ${APP_SECRET:-dev-app-secret}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SENIOR_PASSWORD: ${SENIOR_PASSWORD:-senior}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operator}
    depends_on:
      postgres: { condition: service_healthy }

  emulator:
    build: { context: ., dockerfile: emulator/Dockerfile }
    environment:
      <<: *secrets
      BACKEND_URL: http://backend:8080

  web:
    build: ./web
    ports: ["80:80", "443:443"]
    volumes: [caddy_data:/data]
    depends_on: [backend]

volumes:
  pgdata:
  caddy_data:
